name: Déploiement

# Provisionne Supabase et Vercel puis déploie en production.
# Se lance à chaque push sur main ou sur la branche de développement, et à la demande.
# Sans les secrets SUPABASE_ACCESS_TOKEN, VERCEL_TOKEN et APP_OWNER_EMAIL, il s'arrête en expliquant quoi faire.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Secrets présents ?
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_OWNER_EMAIL: ${{ secrets.APP_OWNER_EMAIL }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$APP_OWNER_EMAIL" ] && missing="$missing APP_OWNER_EMAIL"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Déploiement en attente de configuration"
              echo "Secrets manquants :$missing"
              echo ""
              echo "Ajoutez-les dans Settings → Secrets and variables → Actions (voir le README, section Déploiement), puis relancez ce workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Déploiement ignoré : secrets manquants ($missing)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Provisionner et déployer
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/deploy/provision.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_OWNER_EMAIL: ${{ secrets.APP_OWNER_EMAIL }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ORG_SLUG: ${{ vars.SUPABASE_ORG_SLUG }}
