name: Sources publiques

# Vérifie le code d'intégration contre les sources publiques réelles (réseau requis).
on:
  push:
    branches: ['**']
    paths: ['lib/server/**', 'lib/market/**', 'tests/live/**', '.github/workflows/sources.yml']
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
      - name: Rapport
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./live-report.json'); const s=x=>JSON.stringify(x).slice(0,600); for (const [k,v] of Object.entries(r)) console.log(k, s(v))" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./live-report.json'); for (const [k,v] of Object.entries(r)) console.log('LIVE', k, JSON.stringify(v).slice(0,1500))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: live-report.json
