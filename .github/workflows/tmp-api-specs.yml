name: tmp-api-specs
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/tmp/api-specs.mjs', '.github/workflows/tmp-api-specs.yml']
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/tmp/api-specs.mjs
